# Nixpacks config for Coolify deployment.
# We run on the bun runtime in production because the server uses `bun:sqlite`.
# nixpkgs has no Bun with the CVE-2026-111497 Brotli fix yet, so Bun 1.4.4 comes
# from bun.sh, pinned, and is linked into /usr/bin (on the nixpacks image's
# PATH; /usr/local/bin is not) so the scripts' bare `bun` calls find it.

[variables]
BUN_INSTALL = '/opt/bun'
HOST = '0.0.0.0'
# PORT is supplied by Coolify at runtime.
NODE_OPTIONS = '--max-old-space-size=4096'
NUXT_TELEMETRY_DISABLED = '1'

[phases.setup]
# Node runs `nuxt build`. The nixos-26.05 pin (cached on cache.nixos.org)
# gives Node 22.23.4, which has the same Brotli fix.
nixPkgs = ['nodejs_22']
nixpkgsArchive = 'da6dc0e7b26060f2f71ce3ef7088fb56ee44fa36'
aptPkgs = ['curl', 'unzip']
cmds = [
  'curl -fsSL https://bun.sh/install | bash -s bun-v1.4.4',
  'ln -sf /opt/bun/bin/bun /usr/bin/bun'
]

[phases.install]
cmds = ['bun install --frozen-lockfile']

[phases.build]
cmds = ['bun run build']

[start]
cmd = 'bun --bun .output/server/index.mjs'
